<div class="ui container">
  <div class="ui secondary pointing menu">
    <a routerLink="/" class="item">Angular Email</a>

    <div class="right menu">
      
      @if (signedin$ | async) {
        <a class="ui item" routerLink="/inbox" routerLinkActive="active">
          Inbox
        </a>
        <a class="ui item" routerLink="/signup" routerLinkActive="active">
          Sign Out
        </a>
      } @else {
        <a class="ui item" routerLink="" routerLinkActive="active"  [routerLinkActiveOptions]="{ exact: true }">
          Sign In
        </a>
        <a class="ui item" routerLink="/signout" routerLinkActive="active"  [routerLinkActiveOptions]="{ exact: true }">
          Sign Up
        </a>
      }

    </div>
  </div>

  <router-outlet></router-outlet>
</div>
