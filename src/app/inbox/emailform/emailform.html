<form (ngSubmit)="onSubmit()" class="ui form" [formGroup]="emailForm">
  
  <!-- ✉️ To Alanı -->
  <app-inputt 
    [control]="$any(emailForm.get('to'))" 
    inputType="email" 
    label="To"
  ></app-inputt>

  <!-- 👤 From Alanı -->
  <app-inputt 
    [control]="$any(emailForm.get('from'))" 
    inputType="email" 
    label="From"
  ></app-inputt>

  <!-- 📝 Subject Alanı -->
  <app-inputt 
    [control]="$any(emailForm.get('subject'))" 
    inputType="text" 
    label="Subject"
  ></app-inputt>

  <!-- 💬 Content Alanı (controlType parametresi eklendi) -->
  <app-inputt 
    [control]="$any(emailForm.get('text'))" 
    controlType="textarea" 
    label="Content"
  ></app-inputt>

  <!-- 🚀 Gönder Butonu -->
  <button class="ui button primary">Send</button>

</form>
